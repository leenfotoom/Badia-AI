name: Open Source Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-and-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          files = sorted(set(Path("backend").rglob("*.py")) | set(Path("scripts").rglob("*.py")))
          for file in files:
              ast.parse(file.read_text(encoding="utf-8-sig"), filename=str(file))
          print(f"Validated {len(files)} Python files.")
          PY
      - name: Validate committed JSON and GeoJSON syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(set(Path("data").rglob("*.json")) | set(Path("data").rglob("*.geojson")))
          for file in files:
              with file.open(encoding="utf-8-sig") as source:
                  json.load(source)
          print(f"Validated {len(files)} JSON/GeoJSON files.")
          PY
